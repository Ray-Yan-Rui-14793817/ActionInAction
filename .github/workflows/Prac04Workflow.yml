# CP5401 Practical 04 - Learning workflow syntax

name: Practical 04 Workflow

on:
  push:
    branches:
      - 'main'
    paths:
      - 'doc/**'

  schedule:
    - cron: '0 0 * * FRI'

  workflow_dispatch:

jobs:
  job_1:
    runs-on: ubuntu-latest
    steps:
      - name: Start Job 1
        run: 'echo "Job 1 started"'

  job_2:
    runs-on: ubuntu-latest
    needs: job_1
    steps:
      - name: Run Job 2
        run: 'echo "Job 2"'

  job_3:
    runs-on: ubuntu-latest
    needs: job_1
    steps:
      - name: Run Job 3
        run: 'echo "Job 3"'

  job_4:
    runs-on: ubuntu-latest
    needs: [job_2, job_3]
    steps:
      - name: Complete Practical 04
        run: |
          echo "Job 2 and Job 3 completed."
          echo "Practical 04 workflow completed."
        working-directory: .
        shell: bash
